<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopping Cart | Balghari Store</title>
<meta name="description" content="Review your cart, apply a coupon and proceed to checkout.">
<meta name="keywords" content="computer accessories, mouse, keyboard, SSD, hard drive, headphones, webcam, gaming, Balghari Store">
<meta property="og:title" content="Shopping Cart | Balghari Store">
<meta property="og:description" content="Review your cart, apply a coupon and proceed to checkout.">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="siteHeader" class="site-header"></header>
<main id="main">
<section class="container section"><h1>Shopping Cart</h1><div id="cartWrap" class="cart-layout"><div id="cartItems"></div>
<aside class="card summary" aria-label="Order summary"><h2>Order Summary</h2><div id="cartTotals"></div>
<form id="couponForm" class="coupon"><input id="coupon" placeholder="Coupon (try SAVE10)" aria-label="Coupon code"><button class="btn sm">Apply</button></form>
<a id="checkoutBtn" class="btn block" href="checkout.html">Proceed to Checkout</a></aside></div></section>
</main>
<footer id="siteFooter" class="site-footer"></footer>
<button id="toTop" class="to-top" aria-label="Scroll to top" hidden>↑</button>
<div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-label="Dialog"><div class="modal-box"><button class="modal-close" data-close aria-label="Close dialog">✕</button><div id="modalBody"></div></div></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="js/products.js"></script>
<script src="js/script.js"></script>
<script src="js/cart.js"></script>

</body>
</html>
