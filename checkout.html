<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout | Balghari Store</title>
<meta name="description" content="Secure checkout for your Balghari Store order.">
<meta name="keywords" content="computer accessories, mouse, keyboard, SSD, hard drive, headphones, webcam, gaming, Balghari Store">
<meta property="og:title" content="Checkout | Balghari Store">
<meta property="og:description" content="Secure checkout for your Balghari Store order.">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="siteHeader" class="site-header"></header>
<main id="main">
<section class="container section"><h1>Checkout</h1>
<div id="checkoutWrap" class="cart-layout"><form id="checkoutForm" class="card form-card">
<h2>Customer Information</h2><div class="row2"><div><label for="fname">Full name</label><input id="fname" required autocomplete="name"></div><div><label for="email">Email</label><input id="email" type="email" required autocomplete="email"></div></div>
<label for="phone">Phone</label><input id="phone" type="tel" required pattern="[0-9+\- ]{7,15}" autocomplete="tel">
<h2>Shipping Address</h2><label for="addr">Street address</label><input id="addr" required autocomplete="street-address">
<div class="row2"><div><label for="city">City</label><input id="city" required></div><div><label for="zip">Postal code</label><input id="zip" required></div></div>
<h2>Payment Method</h2><div class="pay">
<label><input type="radio" name="pay" value="Cash on Delivery" checked> Cash on Delivery</label>
<label><input type="radio" name="pay" value="Card"> Credit / Debit Card</label>
<label><input type="radio" name="pay" value="Bank Transfer"> Bank Transfer</label>
<label><input type="radio" name="pay" value="Easypaisa / JazzCash"> Easypaisa / JazzCash</label></div>
<div id="cardBox" hidden><label for="cardNo">Card number (demo only)</label><input id="cardNo" inputmode="numeric" placeholder="4242 4242 4242 4242"></div>
<button class="btn block" type="submit">Place Order</button></form>
<aside class="card summary" aria-label="Order summary"><h2>Order Summary</h2><div id="sumItems"></div><div id="cartTotals"></div></aside></div>
<div id="success" class="card success" hidden><div class="check">✓</div><h2>Order placed successfully!</h2><p>Thank you <strong id="sName"></strong>. Your order number is <strong id="sNo"></strong>.</p><a class="btn" href="shop.html">Continue Shopping</a></div></section>
</main>
<footer id="siteFooter" class="site-footer"></footer>
<button id="toTop" class="to-top" aria-label="Scroll to top" hidden>↑</button>
<div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-label="Dialog"><div class="modal-box"><button class="modal-close" data-close aria-label="Close dialog">✕</button><div id="modalBody"></div></div></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="js/products.js"></script>
<script src="js/script.js"></script>
<script src="js/cart.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
